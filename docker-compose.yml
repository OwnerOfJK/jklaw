services:
  openclaw-gateway:
    build: .
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      AGENTMAIL_API_KEY: ${AGENTMAIL_API_KEY}
      OBSIDIAN_VAULT: /home/node/.openclaw/workspace/memory
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
      ## Uncomment the lines below to enable sandbox isolation
      ## (agents.defaults.sandbox). Requires Docker CLI in the image
      ## (build with --build-arg OPENCLAW_INSTALL_DOCKER_CLI=1) or use
      ## docker-setup.sh with OPENCLAW_SANDBOX=1 for automated setup.
      ## Set DOCKER_GID to the host's docker group GID (run: stat -c '%g' /var/run/docker.sock).
      # - /var/run/docker.sock:/var/run/docker.sock
    # group_add:
    #   - "${DOCKER_GID:-999}"
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"

      - "traefik.http.routers.openclaw.rule=Host(`openclaw.leaf-books.com`)"
      - "traefik.http.routers.openclaw.entrypoints=web"
      - "traefik.http.routers.openclaw.middlewares=redirect-to-https"

      - "traefik.http.routers.openclaw-secure.rule=Host(`openclaw.leaf-books.com`)"
      - "traefik.http.routers.openclaw-secure.entrypoints=websecure"
      - "traefik.http.routers.openclaw-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.openclaw-secure.middlewares=openclaw-ratelimit"

      - "traefik.http.middlewares.openclaw-ratelimit.ratelimit.average=50"
      - "traefik.http.middlewares.openclaw-ratelimit.ratelimit.burst=100"

      - "traefik.http.services.openclaw.loadbalancer.server.port=18789"
      - "traefik.docker.network=dokploy-network"
    mem_limit: 2g
    mem_reservation: 1g
    init: true
    restart: unless-stopped
    command:
      [
        "node",
        "dist/index.js",
        "gateway",
        "--bind",
        "${OPENCLAW_GATEWAY_BIND:-lan}",
        "--port",
        "18789",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:18789/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  openclaw-cli:
    profiles: ["cli"]
    image: ${OPENCLAW_IMAGE:-openclaw:local}
    network_mode: "service:openclaw-gateway"
    cap_drop:
      - NET_RAW
      - NET_ADMIN
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /home/node
      TERM: xterm-256color
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: ${OPENCLAW_ALLOW_INSECURE_PRIVATE_WS:-}
      CLAUDE_AI_SESSION_KEY: ${CLAUDE_AI_SESSION_KEY:-}
      CLAUDE_WEB_SESSION_KEY: ${CLAUDE_WEB_SESSION_KEY:-}
      CLAUDE_WEB_COOKIE: ${CLAUDE_WEB_COOKIE:-}
      BROWSER: echo
    volumes:
      - openclaw_config:/home/node/.openclaw
      - openclaw_workspace:/home/node/.openclaw/workspace
    stdin_open: true
    tty: true
    init: true
    entrypoint: ["node", "dist/index.js"]
    depends_on:
      - openclaw-gateway

  notes:
    build:
      context: ./notes-app
      dockerfile: Dockerfile
    image: notes-app:local
    environment:
      NOTES_DIR: /data/notes
    volumes:
      - openclaw_workspace:/data
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      
      - "traefik.http.routers.notes.rule=Host(`notes.leaf-books.com`)"
      - "traefik.http.routers.notes.entrypoints=web"
      
      - "traefik.http.routers.notes-secure.rule=Host(`notes.leaf-books.com`)"
      - "traefik.http.routers.notes-secure.entrypoints=websecure"
      - "traefik.http.routers.notes-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.notes-secure.middlewares=notes-auth"
      
      - "traefik.http.middlewares.notes-auth.basicauth.users=jk:$$2y$$05$$BbDowwQneBS/0VyRKfdod.5g2hqxAb996wX7S8G/Kg4s5QK6yN/3i"
      
      - "traefik.http.services.notes.loadbalancer.server.port=3000"
      - "traefik.docker.network=dokploy-network"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  openclaw_config:
  openclaw_workspace:

networks:
  dokploy-network:
    external: true
